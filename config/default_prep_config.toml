# Shared base for preprocessing and simulation helpers.
# Experiment-specific prep files should extend this.

add_noise = true
filter_data = false

[data]
u_sigma = 4.0
v_sigma = 4.0

[noise.velocity]
sigma_sec = 5.0
sigma_amp = 5.0
sigma_phase_days = 1.25
wavelength = 2.5e3

[noise.thickness]
amplitude = 50.0
wavelength = 10.0e3

[sim]
meshfile = "aux/simplified_1km.msh"

D_ref = 0.0
side_friction = 0.02

mod_margin_rigidity = false
mod_margin_exponent = false
mod_margin_high = false

n_ref = 3.0
n_amp = 1.0
T_n = 45.0e3
n_shift = 0.0

B0 = 0.625
B_rifts = [0.7, 0.6]
B_amp = 0.5
T_B = 20.0e3
B_shift = 0.0

smb_in = -10.0
smb_out = -1.0

T_in = -25.0
T_out = -20.0
