extends = "default_config.toml"

# Prep-specific overrides live in config_sinusoidal_prep.toml.
output_dir = "outputs_sinusoidal_lowfreq"

[data]
u_sigma = 0.5

[matrix]
use_ref = true
n_basis_profile = "lowfreq"
base = 1.5

[inverse]
n_iter = 1000
nll_scale = 2500.0

penalties_B = [0.01, 0.0]
penalties_n = [0.01, 0.0]

meshfile = "../aux/rutford_simpler_1km.msh"
opt_type = "adabelief"

[model]
B_min = 0.1
B_max = 2.5
n_min = 1.0
n_max = 5.0
