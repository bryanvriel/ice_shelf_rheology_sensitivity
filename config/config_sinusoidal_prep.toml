extends = "default_prep_config.toml"

output_dir = "outputs_sinusoidal_lowfreq"
add_noise = false

[data]
u_sigma = 0.5
v_sigma = 0.5

[sim]
meshfile = "../aux/rutford_simpler_1km.msh"

exp_in = 2.25
exp_out = 2.25

B_rifts = [0.3, 0.3]
T_n = 80.0e3

smb_in = -15.0
smb_out = 0.0

D_ref = -30.0
side_friction = 0.04

[model]
B_min = 0.1
B_max = 2.5
n_min = 1.0
n_max = 5.0
