# Output and geometry files
output_dir = "outputs_default"
shelf_coords_file = "aux/coords_simplified_inverse_shelf.txt"

[data]
# Observation error model
u_sigma = 1.0

[matrix]
# Matrix construction options
spectral = false
use_ref = false
mask = "none"

# Rigidity basis supports
supports_B = [5.5e3, 11.0e3, 22.0e3]
min_strain_B = [0.0, 0.0, 0.0]

# Exponent basis supports
supports_n = [5.5e3, 11.0e3, 22.0e3]
min_strain_n = [0.0, 0.0, 0.0]

# Wavelet base parameter
base = 1.0

[model]
# Rigidity bounds
B_min = 0.1
B_max = 3.0

# Glen exponent bounds
n_min = 0.5
n_max = 5.5

[inverse]
# Optimizer settings
opt_type = "bfgs"
n_iter = 4000
lr = 0.0005
lr_schedule = []
opt_init_seed = 744
opt_init_amp = 0.05

# BFGS tuning parameters
bfgs_factr = 0.001
bfgs_maxcor = 50

# Inversion parameterization
joint = true
fixed_n = 3.0
n_norm_type = "cdf"
B_norm_type = "cdf"
norm_scale = 3.0
precondition = false
hyper_params = [4.5, 2.5, 0.0]

# Prior and likelihood scaling
nll_scale = 1.0
objective_scale = 1.0
penalties_B = 0.0625
penalties_n = 0.1111

# Mesh and boundary treatment
meshfile = "aux/simplified_inverse_1km.msh"
dirichlet_ids = [1,]
smooth_boundary = true

# Boundary inference parameters
infer_boundary_velocity = false
boundary_basis_spacing = 10000.0
boundary_spline_degree = 3
boundary_sigma_alpha = 50.0
boundary_corr_length = 4000.0

[vi]
# Monte Carlo and optimizer settings
num_mc = 0
lr = 8e-4
lr_hyper = 2e-4

# Initial posterior scale defaults
sigma_B_min = 0.7
sigma_n_min = 0.7
sigma_B_default = 1.75
sigma_n_default = 1.75
rho_default = -0.25

# Hyperparameter regularization
lambda_sigma = 0.1
lambda_rho = 0.1

# Hessian stabilization
hess_reg = 1.0
