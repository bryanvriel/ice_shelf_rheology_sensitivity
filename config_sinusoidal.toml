
output_dir = "outputs_sinusoidal_lowfreq"

scale_velocity = false
mod_margins = false
along_modulate = true

n_spline_knots = 8
reg_strengths = [0.01, 4.0]
n_samples = 50000

amp_max = 2.5
amp_log_mean = -0.1
amp_log_std = 0.15
min_scale = 0.05
max_scale = 2.1

theta_std = 0.15

seed_amp = 54
seed_theta = 55

add_trend = true
trend_bounds = [-0.8, 0.8]

plot = true

[matrix]
#min_support = 2.5e3
#max_support = 30.0e3
#min_support_n = 10.0e3
#min_strain = 0.0
#min_amp = 0.3
#base = 1.5
##single_scale = true

min_support = 10.0e3
max_support = 30.0e3
min_support_n = 10.0e3
min_strain = 0.0
min_amp = 0.3
base = 1.5

# increasing min_amplitude effectively scales G
# scaling G decreases the amplitude of the latent vector
min_amplitude = 1.0

[data]
u_sigma = 0.5
v_sigma = 0.5

[emulator]
n_partition = 40
n_epochs = 500
learning_rate = 0.0002
checkfile = "checkpoints_meshvit_large.pkl"

[mcmc]
u_emulator_sigma = 4.60
v_emulator_sigma = 4.04

[inverse]
n_iter = 1000
bfgs_factr = 50.0

nll_scale = 2500.0

penalties_B = [0.01, 0.0]
penalties_n = [0.01, 0.0]

opt_type = "adabelief"

[model]
B_min = 0.1
B_max = 2.5
n_min = 1.0
n_max = 5.0
meshfile = "../aux/rutford_simpler_1km.msh"
solver = "icepack"

[rheology]
exp_in = 2.25
exp_out = 2.25

B_rifts = [0.3, 0.3]

T_n = 80.0e3

smb_in = -15.0
smb_out = 0.0

D_ref = -30.0
side_friction = 0.04
